<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دراسات الحالة | أحمد عمر - حلول تصميمية مؤثرة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- Base Styles, Variables, Header, Footer (Copied from previous examples) --- */
        :root {
            --main-bg: #121212;
            --secondary-bg: #1e1e1e;
            --accent: #FFC107;
            --accent-dark: #FFA000;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            --border-radius: 16px;
            --card-shadow: 0 8px 16px rgba(0,0,0,0.2);
            --card-shadow-hover: 0 16px 32px rgba(0,0,0,0.3);
            --section-spacing: 7rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--main-bg);
            color: var(--text-color);
            line-height: 1.8;
            font-size: 18px;
            direction: rtl;
            scroll-behavior: smooth;
            background: var(--main-bg) radial-gradient(circle at 10% 90%, rgba(255,193,7,0.05) 0%, rgba(18,18,18,0) 30%); /* Adjusted gradient */
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        a { color: var(--text-color); text-decoration: none; transition: var(--transition); }

        /* Header */
        header { padding: 1.5rem 0; position: sticky; top: 0; background: rgba(18, 18, 18, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 100; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .header-inner { display: flex; justify-content: space-between; align-items: center; }
        .menu-toggle { display: none; font-size: 1.8rem; background: none; border: none; color: var(--text-color); cursor: pointer; transition: var(--transition); z-index: 101; }
        .menu-toggle:hover { color: var(--accent); transform: rotate(90deg); }
        .nav-links { display: flex; gap: 2.5rem; }
        .nav-links a { font-weight: 600; position: relative; font-size: 1.1rem; padding: 0.5rem 0; letter-spacing: 0.5px; }
        .nav-links a:hover { color: var(--accent); }
        .nav-links a::before { content: ''; position: absolute; width: 8px; height: 8px; bottom: -4px; right: 50%; transform: translateX(50%) rotate(45deg); background-color: var(--accent); opacity: 0; transition: var(--transition); }
        .nav-links a:hover::before { opacity: 1; bottom: 0; }
        .nav-links a.active { color: var(--accent); }
        .nav-links a.active::before { opacity: 1; bottom: 0; }
        .blog-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.5rem; border-radius: 50px; transition: var(--transition); background: rgba(255, 193, 7, 0.1); border: 1px solid rgba(255, 193, 7, 0.2); }
        .blog-link:hover { color: var(--accent); background-color: rgba(255, 193, 7, 0.2); transform: translateY(-2px); }
        .blog-link svg { transition: transform 0.3s ease; }
        .blog-link:hover svg { transform: rotate(45deg); }
        /* End Header */

        /* --- General Button Styles (Ensure these are present) --- */
        .btn {
            padding: 0.9rem 2.2rem; /* Slightly adjusted padding */
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            position: relative;
            overflow: hidden;
            border: none;
            font-size: 1rem; /* Adjusted font size */
            text-decoration: none; /* Ensure links look like buttons */
        }
        .btn-primary { /* From ssssss.html */
            background-color: var(--accent);
            color: var(--main-bg);
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.3);
        }
        .btn-primary:hover {
            background-color: var(--accent-dark);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(255, 193, 7, 0.4);
        }
        .btn-outline { /* From ssssss.html */
            background-color: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
        }
        .btn-outline:hover {
            background-color: rgba(255, 193, 7, 0.1);
            transform: translateY(-5px);
        }
         .btn svg { transition: var(--transition); }
         .btn:hover svg { transform: translateX(5px); }
        /* --- End Button Styles --- */

        /* --- Case Studies Section --- */
        .cs-section {
            padding: var(--section-spacing) 0;
            position: relative;
            min-height: 60vh;
            display: flex;
            align-items: center;
        }

        .cs-intro { /* Using similar style as works-intro */
            text-align: center;
            margin-bottom: 5rem;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 0.2s;
            width: 100%;
        }

        .cs-title { /* Using similar style as works-title */
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--accent), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
        }

        .cs-subtitle { /* Using similar style as works-subtitle */
            font-size: 1.4rem;
            color: var(--text-secondary);
            font-weight: 500;
            max-width: 700px; /* Slightly wider */
            margin: 0 auto;
            line-height: 1.7; /* More line height */
        }

        /* Coming Soon Container */
        .coming-soon-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem;
            text-align: center;
            background: rgba(30, 30, 30, 0.5);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 193, 7, 0.2);
            box-shadow: 0 0 40px rgba(255, 193, 7, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.4s;
        }

        .coming-soon-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.1) 0%, rgba(255, 193, 7, 0) 70%);
            animation: rotateGradient 15s linear infinite;
            z-index: -1;
        }

        .coming-soon-text {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, var(--accent), var(--accent-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 193, 7, 0.3);
            position: relative;
            display: inline-block;
        }

        .coming-soon-subtext {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .coming-soon-icon {
            font-size: 5rem;
            margin-bottom: 2rem;
            color: var(--accent);
            animation: pulse 2s infinite alternate;
        }

        .notify-btn {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 50px;
            background: rgba(255, 193, 7, 0.1);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .notify-btn:hover {
            background: rgba(255, 193, 7, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 193, 7, 0.2);
        }

        .notify-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .notify-btn:hover::after {
            transform: translateX(100%);
        }

        /* --- Footer (Exact copy) --- */
        footer { padding: 5rem 0 3rem; background-color: var(--secondary-bg); text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); position: relative; margin-top: var(--section-spacing); }
        .footer-text { font-size: 1rem; color: var(--text-secondary); }
        /* --- End Footer --- */

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.1); opacity: 1; }
        }

        @keyframes rotateGradient {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- Responsive --- */
        @media (max-width: 992px) {
            .cs-title { font-size: 3rem; }
            .cs-subtitle { font-size: 1.2rem; }
            .coming-soon-text { font-size: 3.5rem; }
            .coming-soon-subtext { font-size: 1.3rem; }
            .coming-soon-icon { font-size: 4rem; }
        }
        @media (max-width: 768px) {
             :root { --section-spacing: 5rem; --border-radius: 12px; }
            body { font-size: 16px; }
             .cs-section { padding: 4rem 0; }
             .cs-intro { margin-bottom: 4rem; }
             .cs-title { font-size: 2.8rem; }
             .cs-subtitle { font-size: 1.1rem; }
             .coming-soon-text { font-size: 3rem; }
             .coming-soon-subtext { font-size: 1.1rem; }
             .coming-soon-icon { font-size: 3.5rem; }
             .btn { padding: 0.8rem 2rem; font-size: 0.95rem;}

            /* Responsive Nav */
            .menu-toggle { display: block; }
            .nav-links { display: none; flex-direction: column; gap: 1rem; background-color: var(--secondary-bg); position: fixed; top: 0; right: 0; padding: 6rem 2rem 2rem; width: 80%; height: 100vh; box-shadow: -10px 0 30px rgba(0,0,0,0.3); transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
            .nav-links.nav-open { transform: translateX(0); display: flex; }
            .nav-links a { padding: 1rem 0; font-size: 1.2rem; }
        }
        @media (max-width: 576px) {
             :root { --section-spacing: 4rem; }
             .container { padding: 0 1.5rem; }
             .cs-title { font-size: 2.4rem; }
             .cs-subtitle { font-size: 1rem; }
             .coming-soon-container { padding: 3rem 1.5rem; }
             .coming-soon-text { font-size: 2.5rem; }
             .coming-soon-subtext { font-size: 1rem; }
             .coming-soon-icon { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
           <button class="menu-toggle" onclick="toggleMenu()">☰</button>
             <nav class="nav-links" id="navLinks">
                <a href="index.html">الرئيسية</a>
                <a href="works.html">الأعمال</a>
                <a href="about_me.html">من أنا؟</a>
                <a href="cs.html" class="active">دراسات الحالة</a>
                <a href="hireMe.html">وظفني</a>
            </nav>
             <a href="blog.html" class="blog-link">
                <span>المدونة</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0L14.13 5.1l3.75 3.75 2.83-1.81zM3 17.25V21h3.75l11.06-11.06-3.75-3.75L3 17.25z"/>
                </svg>
            </a>
        </div>
    </header>

    <section class="cs-section">
        <div class="container">
            <div class="cs-intro">
                <h1 class="cs-title">دراسات الحالة</h1>
                <p class="cs-subtitle">تحت الإنشاء...سوف اكشف فيها عن منهجيتي في حل المشكلات التصميمية التي واجهتني</p>
            </div>

            <div class="coming-soon-container">
                <div class="coming-soon-icon">✍️</div>
                <h2 class="coming-soon-text">قريباً جداً</h2>
                <p class="coming-soon-subtext">الصفحه قيد التطوير , سيتم نشرها قريبا بصورة تجريدية وتفصيلية</p>
                <button class="notify-btn">أخطرني عند الإطلاق</button>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p class="footer-text">جميع الحقوق محفوظة لـ أحمد عمر © 2025</p>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('nav-open');
        }

        // Optional: Intersection Observer for fade-in
        document.addEventListener('DOMContentLoaded', function() {
            const animateElements = document.querySelectorAll('.cs-intro, .coming-soon-container');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && entry.target.style.opacity === '0') {
                        // CSS animation handles the fade-in
                    }
                });
            }, { threshold: 0.1 });
            animateElements.forEach(element => { observer.observe(element); });
        });
    </script>
</body>
</html>
